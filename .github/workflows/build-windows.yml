name: Windows build

on:
  pull_request:
    paths:
      - "app.py"
      - "music_sync/**"
      - "music_sync.spec"
      - "build/windows_version.txt"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows application
        run: python -m PyInstaller --clean --noconfirm music_sync.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\music-sync.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Expected executable was not produced: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length, LastWriteTime

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-sync-windows-${{ github.sha }}
          path: dist/music-sync.exe
          if-no-files-found: error
